name: Publish Official MCP Registry metadata

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.7.9
  MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the integration package
        run: node scripts/validate.mjs

      - name: Require a matching version tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./server.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$manifest_version" = "$tag_version"

      - name: Install the pinned Official MCP Registry publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate the worldeventtrading.com namespace
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher login http \
            --domain worldeventtrading.com \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish com.worldeventtrading/prediction-markets
        run: ./mcp-publisher publish

      - name: Verify the registry record
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=com.worldeventtrading%2Fprediction-markets' \
            --output registry-result.json
          node - <<'NODE'
          const body = require('./registry-result.json');
          const rows = Array.isArray(body.servers) ? body.servers : [];
          const found = rows.some((row) => {
            const server = row.server && typeof row.server === 'object' ? row.server : row;
            return server.name === 'com.worldeventtrading/prediction-markets'
              && server.version === require('./server.json').version;
          });
          if (!found) {
            throw new Error('Published W.E.T. server version was not returned by the registry API.');
          }
          NODE
