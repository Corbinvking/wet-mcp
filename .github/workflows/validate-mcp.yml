# Literal workflow-name compatibility for launch playbooks. validate.yml remains the
# canonical push/pull-request workflow; this entry point is manual to avoid duplicate CI.
name: Validate MCP package (compatibility entry point)

on:
  workflow_dispatch:
    inputs:
      live:
        description: Also validate the deployed endpoint
        required: false
        default: false
        type: boolean
      endpoint:
        description: Hosted or preview MCP endpoint used by live checks
        required: false
        default: https://www.worldeventtrading.com/api/mcp
        type: string
      candidate_protocol_only:
        description: Permit the expected source-rights hold for candidate evidence; never reports launch readiness
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: |
          node --check scripts/verify-live.mjs
          node --check scripts/rollout-evidence.mjs
          node --check scripts/rollout-evidence-verify.mjs
          node scripts/rollout-evidence-verify.mjs
          node --check evals/score-run.mjs
          node scripts/validate.mjs
          node evals/score-run.mjs evals/run-result-template.json --allow-incomplete

  live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/validate.mjs --live
        env:
          WET_MCP_ENDPOINT: ${{ inputs.endpoint }}
      - name: Gate 4 launch-readiness proof
        if: ${{ !inputs.candidate_protocol_only }}
        run: node scripts/verify-live.mjs
        env:
          WET_MCP_ENDPOINT: ${{ inputs.endpoint }}
      - name: Gate 4 candidate protocol proof
        if: ${{ inputs.candidate_protocol_only }}
        run: node scripts/verify-live.mjs --candidate-allow-source-rights-pending
        env:
          WET_MCP_ENDPOINT: ${{ inputs.endpoint }}
